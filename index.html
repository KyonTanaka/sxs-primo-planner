<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primo Star Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: inputs on the left, a sticky "season end" ledger on the right; on phones the ledger comes first and a star bar follows you down. */
:root{
  --bg:#F1EFF8; --surface:#FFFFFF; --sunk:#E8E4F4; --ink:#1D1A38; --muted:#5E5A7D; --line:#D9D4EC;
  --star:#9A6A00; --star-soft:#F6E7B8; --leaf:#24704F; --leaf-soft:#D8F0E3; --warn:#A63E28; --warn-soft:#F9DED6;
  --focus:#6B5BD6;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17152B; --surface:#211E3D; --sunk:#1B1934; --ink:#ECE8FF; --muted:#A29DC4; --line:#353060;
  --star:#F2C14E; --star-soft:#3B3322; --leaf:#7FD1A8; --leaf-soft:#1E3A30; --warn:#FF9478; --warn-soft:#45231E; --focus:#A99BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17152B; --surface:#211E3D; --sunk:#1B1934; --ink:#ECE8FF; --muted:#A29DC4; --line:#353060;
  --star:#F2C14E; --star-soft:#3B3322; --leaf:#7FD1A8; --leaf-soft:#1E3A30; --warn:#FF9478; --warn-soft:#45231E; --focus:#A99BFF; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 96px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font:700 clamp(26px,4vw,38px)/1.1 var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,410px);gap:28px;align-items:start}
.inputs{display:flex;flex-direction:column;gap:14px;min-width:0}
.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.ledger{position:static;max-height:none}}

section.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
section.box h2{font:600 17px/1.3 var(--body);margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select{font:500 15px var(--body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input::placeholder{color:var(--muted);opacity:.7}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--star)}
.seg{display:inline-flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:10px;flex-wrap:wrap}
.seg button{border:0;background:none;font:600 13px var(--body);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,16,50,.15)}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-top:10px}
.slot{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:6px 8px}
.slot span:first-child{min-width:2.2em;color:var(--ink);font-weight:600}
.slot input{padding:5px 6px;background:var(--surface);text-align:center}
.slot .arrow{color:var(--muted)}
.slot.one{grid-template-columns:auto 1fr}
.big-summary{font:600 15px var(--body);color:var(--ink)}
.goalgroup .sub{margin-top:14px}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px}
.bulk label.f{width:130px}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{margin-left:auto;background:var(--star);color:var(--surface);border-color:var(--star)}
.plan{margin-top:12px;padding:14px;border-radius:12px;background:var(--sunk);font-size:14px;display:flex;flex-direction:column;gap:8px}
.plan ul{margin:0;padding-left:18px}
.plan p{margin:0}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}

.mat{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.mat th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;padding:4px 6px}
.mat td{padding:4px 6px;border-top:1px solid var(--line)}
.mat td:first-child{font-weight:600;white-space:nowrap}
.mat tr.q td{border-top:0}
.mat.nodaily th:nth-child(4),.mat.nodaily td:nth-child(4){display:none}
.mat tr.q td:first-child{font-weight:500;padding-left:18px}
.mat td:first-child .small{white-space:normal;font-weight:400}
.mat input{padding:6px 8px;min-width:84px}
.scroll{overflow-x:auto}

/* Ledger */
.lead{color:var(--muted);font-size:14px;margin:0}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.hero svg{width:46px;height:46px;flex:none}
.big{font:700 clamp(46px,7vw,64px)/1 var(--display);color:var(--star);letter-spacing:.01em}
.unit{font:600 15px var(--body);color:var(--ink)}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.parts li{background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.parts b{color:var(--ink);font-weight:600}
.target{margin-top:14px;padding:12px;border-radius:12px;background:var(--sunk)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--star);border-radius:99px;transition:width .2s ease-out}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.ok{background:var(--leaf-soft);color:var(--leaf)}
.bad{background:var(--warn-soft);color:var(--warn)}
.ledger h3{font:600 14px var(--body);margin:18px 0 6px;color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--muted);font-weight:600;text-align:right;padding:4px 4px;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:5px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
.tbl tfoot td{font-weight:700;color:var(--ink)}
.small{font-size:12px;color:var(--muted)}
.warns{margin:14px 0 0;padding-left:18px;color:var(--warn);font-size:13px}
.fieldwarn{display:block;background:var(--warn-soft);color:var(--warn);font-size:13px;border-radius:8px;padding:8px 10px;margin-top:6px}
.example{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--star-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.example p{margin:0;flex:1 1 220px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;gap:2px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-bottom:2px solid transparent;background:none;font:600 14px var(--body);color:var(--muted);padding:10px 12px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--star)}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.missing{margin-top:12px;padding:12px;border-radius:12px;background:var(--warn-soft);font-size:14px}
.missing p{margin:0}
.missing ul{margin:6px 0;padding-left:18px}
.link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--warn);text-decoration:underline;cursor:pointer}
.ready{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf);font-size:14px}
.plan h4{font:600 14px var(--body);margin:4px 0 0}
@media (max-width:900px){.grid:not([data-tab="goal"]) .ledger{display:none}}
.step{margin:0 0 2px;font-size:12px;font-weight:600;color:var(--star);letter-spacing:.04em}
.intro{margin:4px 0 0;font-size:14px;color:var(--ink);max-width:65ch}
.sub{font:600 14px var(--body);margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
small.help{font-size:12px;line-height:1.4;color:var(--muted)}
/* Fields with an explanation: 2 columns on PC, 1 on phones; label / box / help share rows so the boxes line up */
.row:has(small.help){grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px 20px;align-items:start}
.row:has(small.help) label.f{display:grid;grid-row:span 3;grid-template-rows:subgrid;gap:6px}
.row:has(small.help) label.f>span{align-self:end;color:var(--ink);font-weight:600}
.cols{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.cols b{color:var(--ink)}
.ref{margin:10px 0 0;max-width:420px}
.ref img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.ref figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.progress{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.next{display:flex;flex-direction:column;gap:10px}
.nextbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
#clearTabBtn{margin-right:auto}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn-soft);border-color:var(--warn)}
.clearrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}
.stepstat{margin:0;padding:10px 12px;border-radius:12px;font-size:14px}
.stepstat.ok{background:var(--leaf-soft);color:var(--leaf)}
.stepstat.bad{background:var(--warn-soft);color:var(--warn)}
.verdict{padding:12px 14px;border-radius:12px;font-size:15px}
/* goal box + Astral Pact milestone list side by side */
.row:has(small.help) label.f>span.goalin{display:flex;gap:8px;align-self:stretch;font-weight:400}
.goalin input{flex:0 0 6.5em}
.goalin select{flex:1 1 0;min-width:0;text-overflow:ellipsis}
.pactnote{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--star-soft);font-size:14px;display:flex;flex-direction:column;gap:8px}
.pactnote p{margin:0}
.pactnote .btns{display:flex;flex-wrap:wrap;gap:8px}
.pactline{margin:0;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--star-soft)}
.pacttbl{margin-top:8px}
.pacttbl td:first-child{font-weight:600;white-space:nowrap}
.pacttbl td,.pacttbl th{text-align:left!important}
.pacttbl tr.got td{color:var(--leaf)}
.pacttbl tr.nx td{font-weight:700;background:var(--star-soft)}
h3.sc{font:600 17px var(--body);margin:6px 0 2px;color:var(--ink)}
.scnote{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0 8px}
.alt{margin:0;font-size:15px}.alt b{font:700 22px var(--display);color:var(--star)}
.verdict b{display:block;font-size:17px;margin-bottom:2px}
.plan .tbl{background:var(--surface);border-radius:8px}
.plan .tbl td,.plan .tbl th{padding:6px 8px}
.todo{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (max-width:520px){
  section.box:has(.plan){padding:12px}
  .plan{padding:10px}
  /* columns size to their content and only wrap between words: numbers and names never split */
  .plan .tbl th,.plan .tbl td{text-align:left;padding:5px 4px}
  .plan .tbl{font-size:12px}
  .plan .tbl .chip{white-space:normal;padding:2px 6px}
}
@media (max-width:360px){.plan{padding:8px}.plan .tbl{font-size:11px}.plan .tbl th,.plan .tbl td{padding:4px 2px}.plan .tbl .chip{font-size:11px;padding:2px 5px}}
.sbar{display:none}
@media (max-width:900px){
  .sbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .sbar b{font:700 22px var(--display);color:var(--star)}
}
.slots.compact{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.elhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 -2px}
h4.el{margin:0;font-size:13px;color:var(--ink)}
.elall{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.elall input{width:4.5em;padding:5px 6px;text-align:center}
.slots.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.slots.named .slot{grid-template-columns:5.6em minmax(0,1fr)} /* same label width so the boxes line up */
.slots.three{display:flex;flex-wrap:wrap;justify-content:center}
.slots.three>.slot{flex:0 0 calc((100% - 16px)/3);min-width:0}
.slots.three{row-gap:0;margin-top:2px}.slots.three>.slot{margin-top:8px}
.slots.three .brk{flex-basis:100%} /* weapons on one row, armor on the next, like the game */
/* columns follow the card's own width (the PC layout can make the card narrow too) */
#groups .box,#goalGroups .goalgroup{container-type:inline-size}
@container (max-width:600px){.slots.named.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:460px){.slots.three>.slot{flex-basis:calc((100% - 8px)/2)}}
@container (max-width:400px){.slots.named .slot{grid-template-columns:minmax(0,1fr);text-align:center}}
@media (max-width:520px){
  input,select{font-size:16px} /* below 16px iOS Safari zooms in on focus */
  .slot input{padding:5px 2px}
  .compact .slot{gap:4px;padding:6px}
  .compact .slot span:first-child{min-width:1.6em}
  .slots.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mat{table-layout:fixed}
  .mat th:first-child,.mat td:first-child{width:24%;white-space:normal;font-size:13px}
  #matTable th:nth-child(2){width:31%} #matTable th:nth-child(3){width:25%} /* "Have" holds the biggest numbers */
  #matTable.nodaily th:first-child{width:38%} #matTable.nodaily th:nth-child(2){width:34%} #matTable.nodaily th:nth-child(3){width:28%}
  .mat td{padding:4px 3px}
  .mat input{min-width:0;padding:6px 3px;text-align:center}
  .lang button{padding:10px 16px}
}
footer{margin-top:28px;color:var(--muted);font-size:13px;max-width:75ch}
footer a{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="name">Primo Star Planner</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-es" data-lang="es">Español</button>
      <button type="button" id="lang-en" data-lang="en">English</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="grid" data-tab-host>
    <div class="inputs">
      <div class="example" id="exampleBox" data-tab="goal" hidden>
        <p id="exampleText"></p>
        <button type="button" class="btn primary" id="startBtn" data-i18n="start"></button>
        <button type="button" class="btn" id="exampleBtn" data-i18n="see_example"></button>
        <button type="button" class="btn" id="clearBtn" data-i18n="clear"></button>
      </div>

      <section class="box" data-tab="goal">
        <h2 data-i18n="sec_goal"></h2>
        <p class="intro" data-i18n="i_goal"></p>
        <p class="progress" id="progressLine"></p>
        <div class="row">
          <label class="f"><span data-i18n="primo_have"></span><input id="primoHave" class="num" type="text" inputmode="numeric"><small class="help" data-i18n="primo_have_hint"></small><small class="fieldwarn" id="haveWarn" hidden></small></label>
          <label class="f"><span data-i18n="primo_target"></span><span class="goalin"><input id="primoTarget" class="num" type="text" inputmode="numeric"><select class="pactPick"></select></span><small class="help" data-i18n="h_target"></small></label>
        </div>
        <div class="pactnote" id="pactNote" hidden></div>
        <details id="det-pact"><summary data-i18n="pact_h"></summary><div id="pactTable"></div></details>
        <div class="missing" id="missingBox" hidden></div>
        <p class="ready" id="readyBox" data-i18n="ready" hidden></p>
        <div class="bulk"><button type="button" class="btn primary" id="suggestBtn" data-i18n="suggest_btn"></button><button type="button" class="btn accent" id="fillBtn" hidden></button></div>
        <p class="hint" data-i18n="suggest_hint"></p>
        <div class="clearrow"><button type="button" class="btn danger" id="clearAllBtn" data-i18n="clear_all"></button><small class="help" data-i18n="clear_all_hint"></small></div>
        <div class="plan" id="planBox" hidden></div>
      </section>

      <section class="box" data-tab="time">
        <p class="step" data-step="time"></p>
        <h2 data-i18n="sec_time"></h2>
        <p class="intro" data-i18n="i_time"></p>
        <h3 class="sub" data-i18n="sub_end"></h3>
        <div class="seg" role="group">
          <button type="button" id="modeRemaining" data-mode="remaining" data-i18n="mode_remaining"></button>
          <button type="button" id="modeExact" data-mode="exact" data-i18n="mode_exact"></button>
          <button type="button" id="modeStart" data-mode="start" data-i18n="mode_start"></button>
        </div>
        <p class="hint" data-i18n="mode_one"></p>
        <div class="row" id="remainingBox">
          <label class="f"><span data-i18n="days"></span><input id="remDays" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="f"><span data-i18n="hours"></span><input id="remHours" type="number" min="0" max="23" step="1" inputmode="numeric"></label>
        </div>
        <div class="row" id="exactBox" hidden>
          <label class="f"><span data-i18n="end_exact"></span><input id="endExact" type="datetime-local"></label>
        </div>
        <div class="row" id="startBox" hidden>
          <label class="f"><span data-i18n="start_date"></span><input id="seasonStart" type="date"><small class="help" data-i18n="h_start_date"></small></label>
        </div>
        <p class="hint" id="modeHint"></p>
        <h3 class="sub" data-i18n="sub_account"></h3>
        <div class="row">
          <label class="f"><span data-i18n="season"></span><select id="season"></select><small class="help" data-i18n="h_season"></small></label>
          <label class="f"><span data-i18n="reset_time"></span><input id="resetTime" type="time" value="09:00"><small class="help" data-i18n="h_reset"></small></label>
          <label class="f"><span data-i18n="boost"></span><input id="boost" type="number" min="0" step="1" value="2"><small class="help" data-i18n="h_boost"></small></label>
          <label class="f"><span data-i18n="crystals"></span><input id="crystals" type="number" min="0" step="1" inputmode="numeric"><small class="help" data-i18n="crystals_hint"></small></label>
        </div>
        <h3 class="sub" data-i18n="res_head"></h3>

function entriesAvail(e,resets){const b=$("r_"+e+"B");if(intv(b)>BUY_MAX)b.value=BUY_MAX;return n("r_"+e+"H")+(n("r_"+e+"D")+intv(b)*PER_BUY)*resets+(packGive[e]||0)}
// Purchases still possible before the end, counting the current day/week.

function packMax(p,now,end,h,m){
 if(p.every==="day")return countResets(now,end,h,m)+1;
 let k=1;const c=resetAtOrAfter(now,h,m);if(c<=now)c.setDate(c.getDate()+1);

 return k}

const nf=()=>new Intl.NumberFormat(lang==="es"?"es-VE":"en-US");
const fmt=x=>nf().format(Math.floor(x));
// .num text fields carry thousands separators (digits only); number fields may hold "2.5" or "-1"
const intv=el=>{if(!el)return 0;if(el.type==="number"){const v=Math.floor(Number(el.value));return v>0?v:0}const d=String(el.value).replace(/[^\d]/g,"");return d?Number(d):0};
const n=id=>intv($(id));
const has=id=>$(id)&&String($(id).value).trim()!=="";

// Live thousands separator: keeps the caret after the same digit while you type.
function formatNumField(el){
 const pos=el.selectionStart??el.value.length;
 const digitsBefore=el.value.slice(0,pos).replace(/\D/g,"").length;
 const raw=el.value.replace(/\D/g,"");
 el.value=raw?nf().format(Number(raw)):"";
 if(document.activeElement!==el)return;
 let i=0,seen=0;while(i<el.value.length&&seen<digitsBefore){if(/\d/.test(el.value[i]))seen++;i++}
 el.setSelectionRange(i,i);
}

function missingFields(){

 for(const [id,k] of [["charLv","char_lv"],["charXp","char_xp"],["xpHr","xp_hr"]])if(!has(id))add("char",t(k));
 for(const g of GROUPS)if(!has(g.key+"C0"))add("levels",t(g.key));

function toLocalInput(d){const p=x=>String(x).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}

// ---------- time ----------
function resetAtOrAfter(t0,h,m){const c=new Date(t0);c.setHours(h,m,0,0);if(c<t0)c.setDate(c.getDate()+1);return c}
function countResets(a,b,h,m){if(!(b>a))return 0;const c=resetAtOrAfter(a,h,m);if(c<=a)c.setDate(c.getDate()+1);let k=0;while(c<b&&k<5000){k++;c.setDate(c.getDate()+1)}return k}
function seasonEnd(now,h,m){
 if(mode==="exact"){const d=new Date($("endExact").value);return isFinite(d)?d:now}
 if(mode==="start"){
  // season end = start date + season length, at the daily reset
  const v=$("seasonStart").value,len=seasonDays(Number($("season").value)||1);
  if(!v||!len)return now;
  const [y,mo,d]=v.split("-").map(Number);return new Date(y,mo-1,d+len,h,m);
 }
 // The game countdown drops the minutes, so the real end is the first reset at or after (shown time − 59 min).
 if(!remEnd){const cand=new Date(now.getTime()+(n("remDays")*24+n("remHours"))*36e5-59*6e4);remEnd=resetAtOrAfter(cand,h,m)}
 return new Date(remEnd);
}

// ---------- step costs ----------
// At each rollover every level above the season's floor is wiped and the spent materials are gone; leftover materials stay
// (confirmed by players: S2 starts at Lv100 and you climb 100→130 again for no points). Those levels are bought again at the
// price of the season that introduced them (estimated: the game's tables for each season start at its own floor).
const seasonOf=(s,L,f="floor")=>{let q=s;while(q>1&&L<=RULES[q][f])q--;return q};
const MAT_KEY={skill:"essence",fant:"treats",relic:"sand"};
function stepOf(key,s,L){const q=seasonOf(s,L,key==="relic"?"relicBase":"floor"),R=RULES[q];
 return {R,c:key==="gear"?gearStep(R,L):key==="skill"?skillStep(R,q,L):key==="fant"?fantStep(R,q,L):relicStep(R,q,L)}}
// adds the cost of reaching level L to `to`; false when the cost isn't known
function addStep(to,key,s,L){const {R,c}=stepOf(key,s,L);if(c===null)return false;
 if(key==="gear"){to.ore+=c;to.rola+=c*2;if((L-R.floor)%5===0&&L>R.floor)to.forge+=R.forgeStone||0}else to[MAT_KEY[key]]+=c;return true}
function gearStep(R,L){const b=L-R.floor;if(b<1)return 0;if(b>300||R.gearBase===undefined)return null;return Math.round((R.gearBase+(Math.min(b,150)-1)*R.gearRate)/5)*5}
function skillStep(R,s,L){const b=L-R.floor;if(b<1)return 0;if(b>(s<=2?150:180)||R.skillBase===undefined)return null;return Math.round((R.skillBase+(b-1)*R.skillRate)/5)*5}
function fantStep(R,s,L){const b=L-R.floor;if(b<1)return 0;const x=FANTXP[s]?.[b-1];return x>0?x:null}
function relicStep(R,s,L){const b=L-R.relicBase;if(b<1)return 0;if(b>(s<=2?15:18)||R.relicBaseCost===undefined)return null;const a=R.relicBaseCost+(b-1)*R.relicRate;return R.relicTier==="blue"?a*5:a*25}
function capsAt(s,lv){
 if(s===2){let row=S2CAPS[0];for(const c of S2CAPS)if(lv>=c.level)row=c;return row}
 if(s===1)return {relic:lv<100?10:Math.max(10,Math.floor(lv/10)+1)};
 return {};
}

function calc(){
 syncElAll();
 const daily=$("useDaily").checked;$("matTable").classList.toggle("nodaily",!daily);$("colDayLi").hidden=!daily;
 const s=Number($("season").value)||1,R=RULES[s],warns=[];
 const [rh,rm]=($("resetTime").value||"09:00").split(":").map(Number);
 const now=new Date(),end=seasonEnd(now,rh||0,rm||0);lastEnd=end;
 const realH=Math.max(0,(end-now)/36e5);
 if(end<=now)warns.push(t("w_ended"));
 const resets=countResets(now,end,rh||0,rm||0),boost=Math.max(0,n("boost"));
 const crystalH=n("crystals")*2; // in-game text: "2 hours of resources based on your Cart and Bed levels"
 if(n("saveHours")>36)$("saveHours").value=36;
 const saving=$("saveExp").checked,saveH=saving?Math.min(36,n("saveHours"),realH):0;
 // Cart and Bed both stop being claimed for the last saveH hours; reset boosts and crystals stay usable
 const matH=realH-saveH+resets*boost+crystalH;
 const xpH=matH;
 const passMode=$("pass").value||"none",passMul=passMode==="buy"?1+PASS:1;
 const xpHr=n("xpHr")*passMul;
 // packs: clamp to what the shop still allows before the end
 packGive={};const packs=[];
 for(const pk of PACKS){
  const max=packMax(pk,now,end,rh||0,rm||0),el=$("pk_"+pk.id);
  if(intv(el)>max)el.value=max;
  const k=intv(el);packs.push({...pk,left:max-k});
  $("pkmax_"+pk.id).textContent=t("pk_max",{n:max});
  for(const m in pk.give)packGive[m]=(packGive[m]||0)+pk.give[m]*k;
 }

 // character
 const table=CHARXP[s];let lv=n("charLv")||R.floor,xp=n("charXp"),frac=0;
 if(!table){warns.push(t("w_noxp",{s}))}
 else{
  const f1=RULES[1].floor;if(lv<f1){warns.push(t("w_below",{f:f1}));lv=f1;xp=0}
  // EXP waiting in the Bed counts too, unless we're already inside the reserve window (then it's part of the reserve)
  const inReserve=saving&&realH<=Math.min(36,n("saveHours"));
  let pool=xp+xpH*xpHr+(inReserve?0:n("bedXp"));
  for(let g=0;g<1000;g++){const q=seasonOf(s,lv+1),need=CHARXP[q]?.[lv-RULES[q].floor];if(!need){warns.push(t("w_table",{s,l:lv}));pool=0;break}if(pool>=need){pool-=need;lv++}else{frac=pool/need;break}}
 }
 const charLv=Math.max(0,lv-R.floor),charPts=lv>=R.floor?charLv*R.charW+Math.floor(frac*R.charW+1e-9):0;

 // groups
 const curs={},sup={},caps=capsAt(s,lv),rows=[],need={ore:0,rola:0,essence:0,sand:0,treats:0,forge:0},unknown={};
 rows.push({k:"char",lv:charLv+frac,w:R.charW,p:charPts});
 for(const g of GROUPS){
  const fl=R[g.floor],cf=RULES[1][g.costFloor],cap=caps[g.key];let lvls=0,capped=false,atCap=cap!==undefined;
  curs[g.key]=[];
  for(let i=0;i<g.count;i++){
   const cur=has(g.key+"C"+i)?n(g.key+"C"+i):fl;curs[g.key].push(cur);
   let tar=Math.max(cur,has(g.key+"P"+i)?n(g.key+"P"+i):cur); // a goal below the current level can't lower it
   if(cap!==undefined&&tar>cap){tar=Math.max(cur,cap);capped=true}
   if(cap!==undefined&&tar<cap)atCap=false;
   lvls+=Math.max(0,tar-fl);
   for(let L=Math.max(cur,cf)+1;L<=tar;L++)if(!addStep(need,g.key,s,L))unknown[g.key]=true;
  }
  if(capped)warns.push(t("w_cap",{g:t(g.key),c:(g.key==="relic"?"+":"Lv")+cap}));
  if(unknown[g.key])warns.push(t("w_cost",{g:t(g.key)}));
  rows.push({k:g.key,lv:lvls,w:R[g.w],p:lvls*R[g.w],atCap});
  const btn=$(g.key+"Cap");
  if(cap!==undefined){btn.hidden=false;btn.dataset.cap=cap;btn.textContent=t("fill_cap",{c:(g.key==="relic"?"+":"Lv")+cap})}else{btn.hidden=true;btn.dataset.cap=""}
  $("hint-"+g.key).textContent=t("group_hint")[g.key].replace("{w}",R[g.w]).replace("{f}",fl);
 }
 if(s===1)warns.push(t("w_s1caps"));
 $("charHint").textContent=t("char_floor",{s,f:R.floor});

 // supply
 const yields=REALM[s]?.[(Number($("realmRank").value)||3)-1];
 const ex=Math.max(1,n("expTreat"));
 const matRows=[],passiveOf={};
 for(const m of ["ore","rola","essence","sand","treats"]){
  let passive=qv(m,"H")+qv(m,"R")*matH*passMul+qv(m,"D")*resets;
  if(m==="treats")passive*=ex;
  passive+=packGive[m]||0;passiveOf[m]=passive;
  const nd=need[m];let status,cls;
  const ent=ENTRIES.find(e=>e[1]===m);
  let total=passive;
  if(nd<=passive){status=t("st_ok");cls="ok"}
  else if(ent&&yields){
   const y=yields[["ore","rola","essence","sand"].indexOf(m)],avail=entriesAvail(ent[0],resets);
   const want=Math.ceil((nd-passive)/y);
   if(want<=avail){status=t("st_entries",{n:fmt(want),m:fmt(avail)});cls="ok";total=passive+want*y}
   else{total=passive+avail*y;status=t("st_short",{n:fmt(nd-total)});cls="bad"}
  }else{status=t("st_short",{n:fmt(nd-passive)});cls="bad"}
  matRows.push({m,nd,total,status,cls});
  sup[m]=passive+(ent&&yields?entriesAvail(ent[0],resets)*yields[["ore","rola","essence","sand"].indexOf(m)]:0);
 }
 // what the monthly pass adds (or would add) until the end
 const gain=x=>fmt(x*PASS);
 const passVals={xp:gain(xpH*n("xpHr")),ore:gain(n("m_oreR")*matH),rola:gain(n("m_rolaR")*matH),essence:gain(n("m_essenceR")*matH),sand:gain(qv("sand","R")*matH)};
 $("passHint").textContent=t("pass_hint_"+passMode,passVals);
 for(const [e,m] of ENTRIES){const i=["ore","rola","essence","sand"].indexOf(m);$("y_"+e).textContent=yields?`${fmt(yields[i])} ${t(m==="sand"?"sand":m)}`:t("st_unknown")}

 // stars
 const score=rows.reduce((a,r)=>a+r.p,0);
 const fromScore=Math.floor(score/R.perStar),have=n("primoHave"),total=have+fromScore+R.fixed;
 // S1 has no past seasons: a number here is almost surely the Progress count, counted twice. Shown right under the field.
 $("haveWarn").hidden=!(s===1&&have>0);if(s===1&&have>0)$("haveWarn").textContent=t("w_have_s1",{h:fmt(have)});
 const target=n("primoTarget");
 const wantSave=saving?Math.min(36,n("saveHours")):0,saveStart=new Date(end.getTime()-wantSave*36e5);
 const freeEntries={},buys={};
 for(const [e] of ENTRIES){buys[e]=intv($("r_"+e+"B"));freeEntries[e]=n("r_"+e+"H")+n("r_"+e+"D")*resets+(packGive[e]||0)}
 lastCtx={s,R,charPts:rows[0].p,lv,curLv:n("charLv"),caps,curs,sup,forgeHave:n("m_forgeH")+(packGive.forge||0),forgeKnown:has("m_forgeH"),have,target,yields,resets,packs,passMode,
  passive:passiveOf,freeEntries,buys,saving,wantSave,saveStart,now,end,crystals:n("crystals")};
 renderMissing();
 lastO={s,R,end,now,realH,resets,crystalH,wantSave,saveStart,matH,xpH,saveH,xpHr,lv,frac,rows,score,fromScore,have,total,target,matRows,need,warns,table,forgeHave:lastCtx.forgeHave};
 render(lastO);
 save();
 if(!altBusy){clearTimeout(svTimer);svTimer=setTimeout(updateSaved,250)}
}

// ---------- plan suggestion ----------
// One target level per category (slots below it are raised to it), costed with the same step tables as calc().
function suggestPlan(){
 const c=lastCtx;if(!c)return null;
 const {s,R,caps}=c,mats=["ore","rola","essence","sand","treats"];
 const limit={};
 for(const g of GROUPS){
  let cap=caps[g.key];
  // Season 1: conservative caps from Avalon's calculator (unconfirmed)
  if(s===1&&g.key==="skill")cap=Math.max(...c.curs.skill,c.curLv);
  if(s===1&&g.key==="fant")cap=Math.max(...c.curs.fant,Math.floor(c.curLv/10)*10+10);
  limit[g.key]=Math.max(cap??Math.max(...c.curs[g.key])+60,Math.min(...c.curs[g.key])); // at least one option even if a slot is already past the cap
 }
 const opts={};
 for(const g of GROUPS){
  const cur=c.curs[g.key],fl=R[g.floor],cf=RULES[1][g.costFloor],list=[];
  const cost={ore:0,rola:0,essence:0,sand:0,treats:0,forge:0};
  const lo=Math.min(...cur);
  for(let tg=lo;tg<=limit[g.key];tg++){
   let known=true;
   if(tg>lo){
    for(const cu of cur){
     if(tg<=Math.max(cu,cf))continue;
     if(!addStep(cost,g.key,s,tg)){known=false;break}
    }
   }
   if(!known)break;
   const pts=cur.reduce((a,cu)=>a+Math.max(0,Math.max(cu,tg)-fl),0)*R[g.w];
   list.push({t:tg,pts,cost:{...cost}});
  }
  opts[g.key]=list;
 }
 const starsOf=score=>c.have+Math.floor(score/R.perStar)+R.fixed;
 // Each category spends its own materials (gear: ore+rola+forge, skill: essence, fant: treats, relic: sand),
 // so cost and feasibility are per category and pairs merge on a Pareto front instead of a 4-deep loop.
 const MAT_OF={gear:["ore","rola"],skill:["essence"],fant:["treats"],relic:["sand"]};
 for(const g of GROUPS)for(const o of opts[g.key]){
  let use=0,def=0,ok=true;
  for(const m of MAT_OF[g.key]){const nd=o.cost[m],sp=c.sup[m];if(nd>sp+1e-6){ok=false;def+=(nd-sp)/Math.max(1,sp)}else if(nd>0)use+=nd/Math.max(1,sp)}
  if(g.key==="gear"&&c.forgeKnown&&o.cost.forge>c.forgeHave){ok=false;def+=(o.cost.forge-c.forgeHave)/Math.max(1,c.forgeHave)}
  Object.assign(o,{use,def,ok});
 }
 // front: for each score, the cheapest way to reach at least that score (sorted by pts descending, val strictly falling)
 const front=list=>{list.sort((x,y)=>y.pts-x.pts||x.val-y.val);const f=[];for(const e of list)if(!f.length||e.val<f[f.length-1].val-1e-12)f.push(e);return f};
 const pair=(A,B,key,okOnly)=>{const l=[];for(const x of A)if(!okOnly||x.ok)for(const y of B)if(!okOnly||y.ok)l.push({pts:x.pts+y.pts,val:x[key]+y[key],pick:[x,y]});return front(l)};
 const cheapest=(key,okOnly,needPts)=>{
  const AB=pair(opts.gear,opts.skill,key,okOnly),CD=pair(opts.fant,opts.relic,key,okOnly);
  let win=null;
  for(const ab of AB){
   // CD is sorted by pts descending: the last entry still >= the remaining pts is the cheapest one
   let lo=0,hi=CD.length-1,k=-1;
   while(lo<=hi){const mid=(lo+hi)>>1;if(CD[mid].pts>=needPts-ab.pts){k=mid;lo=mid+1}else hi=mid-1}
   if(k<0)continue;
   const v=ab.val+CD[k].val;
   if(!win||v<win.v-1e-12)win={v,picks:[...ab.pick,...CD[k].pick]};
  }
  return win&&win.picks;
 };
 const build=picks=>{const [a,b,e,d]=picks,need={};
  for(const m of mats)need[m]=a.cost[m]+b.cost[m]+e.cost[m]+d.cost[m];
  const stars=starsOf(c.charPts+a.pts+b.pts+e.pts+d.pts);
  return {plan:{gear:a.t,skill:b.t,fant:e.t,relic:d.t},parts:{gear:a.cost,skill:b.cost,fant:e.cost,relic:d.cost},stars,score:c.charPts+a.pts+b.pts+e.pts+d.pts,use:a.use+b.use+e.use+d.use,deficit:a.def+b.def+e.def+d.def,need,forge:a.cost.forge}};
 const maxPts=GROUPS.reduce((acc,g)=>acc+Math.max(...opts[g.key].map(o=>o.pts)),0);
 const maxPossible=starsOf(c.charPts+maxPts);
 // most stars with what you'll have: each category at its highest affordable level (cheapest on ties)
 const top=GROUPS.map(g=>opts[g.key].filter(o=>o.ok).reduce((x,y)=>!x||y.pts>x.pts||(y.pts===x.pts&&y.use<x.use)?y:x,null));
 if(top.some(x=>!x))return null;
 let best={...build(top),reach:false};
 // same stars for less material: drop levels that don't add a whole star
 const lean=cheapest("use",true,(best.stars-c.have-R.fixed)*R.perStar-c.charPts);
 if(lean)best={...build(lean),reach:false};
 if(c.target>0){
  const needPts=(c.target-c.have-R.fixed)*R.perStar-c.charPts;
  const r=cheapest("use",true,needPts);
  if(r)best={...build(r),reach:true};
  else if(best.stars>=c.target)best.reach=true;
  if(!best.reach){const st=cheapest("def",false,needPts);best.stretch=st?build(st):null}
 }
 if(best.reach)best.stretch=null;
 best.maxPossible=maxPossible;
 best.base=c.charPts+GROUPS.reduce((a,g)=>a+opts[g.key][0].pts,0); // raising nothing
 return best;
}
// Astral Pact milestones, read from the game's screens (5 to 860; higher ones aren't confirmed).
// Stars carry over between seasons, so the Pact count is the season-end total. Rewards repeat in this order from 5.
const PACT=(()=>{const a=[];let v=0;for(const [st,k] of [[5,8],[8,8],[12,8],[15,8],[20,8],[25,8],[30,6]])for(let i=0;i<k;i++)a.push(v+=st);return a})();

const pactName=i=>`${fmt(PACT[i])} (${t("pact_r")[i%8]})`;
function pactLine(x){const i=pactLast(x),nx=PACT[i+1];
 let h=i<0?t("pact_none",{p:pactName(0)}):t("pact_got",{p:pactName(i)});
 h+=" "+(nx===undefined?t("pact_top"):t("pact_next",{p:pactName(i+1),d:fmt(nx-x)}));
 if(i>=0&&x>PACT[i]&&nx!==undefined)h+=" "+t("pact_extra",{x:fmt(x-PACT[i])});
 return `<p class="pactline">${h}</p>`}
const rankLine=pl=>pl.score!==undefined?`<p class="small">${t("rank_line",{s:fmt(pl.score),d:fmt(pl.score-pl.base)})}</p>`:"";
// what the goal you typed gets you in the Pact

 const i=pactLast(T),last=PACT[PACT.length-1],tt=fmt(T);let h,btns=[];
 if(T>last)h=t("pn_top");
 else if(i>=0&&PACT[i]===T)h=t("pn_hit",{t:tt,r:t("pact_r")[i%8],k:i+1});
 else{h=t("pn_miss",{t:tt})+" "+(i>=0?t("pn_both",{p:pactName(i),q:pactName(i+1),d:fmt(PACT[i+1]-T),t:tt}):t("pn_first",{q:pactName(i+1)}))+(i>=0?" "+t("pn_keep",{t:tt}):"");

$("pactNote").addEventListener("click",e=>{const b=e.target.closest("[data-goal]");if(b)setGoal(b.dataset.goal)});

// ponytail: what-ifs re-run calc() with some inputs changed, then restore them
function altPlan(ch){const old={},pr=el=>el.type==="checkbox"?"checked":"value";altBusy=true;
 for(const id in ch){const el=$(id);old[id]=el[pr(el)];el[pr(el)]=ch[id]}
 try{calc();const r=suggestPlan();if(r)r.ctx=lastCtx;return r}
 finally{for(const id in ch){const el=$(id);el[pr(el)]=old[id]}calc();altBusy=false}}
// Scenario 3: spend only what you have saved today (inventory + saved Realm entries) and keep the rest.
// No new production, quests, purchases or packs; the character keeps its normal EXP (reserve included).
// suggestPlan already picks the least material for the most stars, so whatever it doesn't spend is a waste to spend.
// Stars the same materials would give next season if kept, spent from `off` levels above next season's floor
// (each level there costs more but scores more). off=0 is the best case; the player's own progress this season is the likely one.
function laterStars(s,mat,off={}){const R=RULES[s+1];if(!R||!R.perStar)return null;let pts=0;
 for(const g of GROUPS){const left={...mat},keys=g.key==="gear"?["ore","rola"]:[MAT_KEY[g.key]],L0=R[g.costFloor]+(off[g.key]||0);
  for(let L=L0+1;L<L0+400;L++){const one={ore:0,rola:0,essence:0,sand:0,treats:0,forge:0};
   let ok=true;for(let i=0;i<g.count&&ok;i++)ok=addStep(one,g.key,s+1,L);if(!ok)break;
   const f=Math.min(1,...keys.map(m=>one[m]>0?left[m]/one[m]:1));

  ${forge}
  ${o.warns.length?`<ul class="warns">${o.warns.map(w=>`<li>${w}</li>`).join("")}</ul>`:""}`;
 $("sbarStars").textContent=fmt(heroTotal);
 renderPactNote();
 const li=pactLast(heroTotal);
 $("pactTable").innerHTML=`<p class="small" style="margin:8px 0 0">${t("pact_intro",{n:fmt(heroTotal)})}</p><div class="scroll"><table class="tbl pacttbl"><thead><tr><th>${t("pact_stars")}</th><th>${t("pact_reward")}</th></tr></thead><tbody>${PACT.map((v,i)=>`<tr class="${i<=li?"got":i===li+1?"nx":""}"><td>${i<=li?"✓ ":""}${fmt(v)}</td><td>${t("pact_r")[i%8]}${i===li+1?` <span class="chip ok">${t("pact_next_tag")}</span>`:""}</td></tr>`).join("")}</tbody></table></div><p class="small">${t("pact_unconf")}</p>`;
}

function setLang(l){
 const snapshot={};for(const el of allInputs())snapshot[el.id]=el.type==="checkbox"?el.checked:el.value;
 const openDet=[...document.querySelectorAll("details[open]")].map(d=>d.id);
 // keep raw digits so the separator switches with the language
 for(const el of document.querySelectorAll("input.num"))snapshot[el.id]=el.value.replace(/\D/g,"");
 lang=l;document.documentElement.lang=l;
 for(const b of document.querySelectorAll(".lang button"))b.setAttribute("aria-pressed",b.dataset.lang===l);
 buildStatic();buildGroups();buildTables();buildTabs();
 applyValues(snapshot);
 for(const id of openDet)$(id)&&($(id).open=true);
 for(const el of document.querySelectorAll("[data-i18n]"))el.textContent=t(el.dataset.i18n);
 for(const el of document.querySelectorAll("[data-i18n-alt]"))el.alt=t(el.dataset.i18nAlt);
 for(const el of document.querySelectorAll("[data-step]"))el.textContent=t("step_n",{n:TABS.indexOf(el.dataset.step),m:TABS.length-1});
 $("footer").innerHTML=t("footer");
 document.title=t("name");
 for(const el of document.querySelectorAll("input.num"))formatNumField(el);
 wire();calc();setTab(tab,false);
}
function setMode(m){
 if(m!==mode&&!missingFields().time){
  const [rh,rm]=($("resetTime").value||"09:00").split(":").map(Number),now=new Date(),end=seasonEnd(now,rh||0,rm||0);
  if(end>now){
   const len=seasonDays(Number($("season").value)||1),p2=x=>String(x).padStart(2,"0");
   if(m==="exact")$("endExact").value=toLocalInput(end);
   if(m==="remaining"){const hl=(end-now)/36e5;$("remDays").value=Math.floor(hl/24);$("remHours").value=Math.floor(hl%24)}
   if(m==="start"&&len){const st=new Date(end.getFullYear(),end.getMonth(),end.getDate()-len);$("seasonStart").value=`${st.getFullYear()}-${p2(st.getMonth()+1)}-${p2(st.getDate())}`}
   mode=m;remEnd=m==="remaining"?end:null;
  }
 }
 mode=m;if(m!=="remaining")remEnd=null;
 $("remainingBox").hidden=m!=="remaining";$("exactBox").hidden=m!=="exact";$("startBox").hidden=m!=="start";
 for(const b of document.querySelectorAll(".seg button"))b.setAttribute("aria-pressed",b.dataset.mode===m);
 calc();
}
function wire(){
 for(const el of allInputs()){
  if(el.dataset.w)continue;el.dataset.w=1;
  // Backspace/Delete next to a thousands separator would only remove the separator (and it comes back): skip over it
  if(el.classList.contains("num"))el.addEventListener("keydown",e=>{
   const i=el.selectionStart;if(i!==el.selectionEnd)return;
   if(e.key==="Backspace"&&i>0&&/\D/.test(el.value[i-1]))el.setSelectionRange(i-1,i-1);
   if(e.key==="Delete"&&i<el.value.length&&/\D/.test(el.value[i]))el.setSelectionRange(i+1,i+1);
  });
  el.addEventListener("input",()=>{if(el.classList.contains("num"))formatNumField(el);if(firstRun){firstRun=false;renderBanner()}if(["remDays","remHours","resetTime"].includes(el.id))remEnd=null;if(el.id==="saveExp")$("saveBox").hidden=!el.checked;calc()});
  if(el.tagName==="SELECT"||el.type==="checkbox")el.addEventListener("change",()=>{$("saveBox").hidden=!$("saveExp").checked;calc()});
 }
 $("saveBox").hidden=!$("saveExp").checked;
}

// Destructive buttons need a second tap within 4 s (the viewer can't show confirm() dialogs)
function armed(btn,idle,ask,act){let tm=null;btn.addEventListener("click",()=>{
 if(!tm){btn.textContent=t(ask);btn.classList.add("armed");tm=setTimeout(()=>{tm=null;btn.textContent=t(idle);btn.classList.remove("armed")},4000);return}
 clearTimeout(tm);tm=null;btn.textContent=t(idle);btn.classList.remove("armed");act()})}
// back to the page's own defaults (reset time, 36 h, 5 quest entries...); selects keep their choice
function clearInputs(els){for(const el of els){if(el.type==="checkbox")el.checked=el.id==="saveExp";else if(el.tagName!=="SELECT")el.value=el.defaultValue}$("saveBox").hidden=!$("saveExp").checked;$("planBox").hidden=true}
function clearAll(){clearInputs(allInputs());showExample=false;firstRun=true;remEnd=null;setMode("remaining");renderBanner();calc()}
armed($("clearBtn"),"clear","clear_confirm",clearAll);
armed($("clearAllBtn"),"clear_all","clear_confirm",clearAll);
armed($("clearTabBtn"),"clear_tab","clear_tab_confirm",()=>{
 clearInputs(document.querySelectorAll(`.inputs [data-tab="${tab}"] input,.inputs [data-tab="${tab}"] select`));
 if(tab==="time"){remEnd=null;setMode("remaining")}
 calc()});
for(const b of document.querySelectorAll(".lang button"))b.addEventListener("click",()=>setLang(b.dataset.lang));
$("startBtn").addEventListener("click",()=>setTab("time"));
$("fillBtn").addEventListener("click",()=>setTab($("fillBtn").dataset.go));
$("exampleBtn").addEventListener("click",()=>{applyExample();showExample=true;firstRun=false;remEnd=null;setMode(EXAMPLE.mode);renderBanner()});
for(const b of document.querySelectorAll(".seg button"))b.addEventListener("click",()=>setMode(b.dataset.mode));

(function boot(){
 const saved=load();
 lang=saved?.lang||((navigator.language||"es").toLowerCase().startsWith("es")?"es":"en");
 mode=saved?.mode||"remaining";tab=TABS.includes(saved?.tab)?saved.tab:"goal";
 buildStatic();buildGroups();buildTables();buildTabs();
 if(saved?.v){applyValues(saved.v);if(!("useDaily" in saved.v))$("useDaily").checked=Object.keys(saved.v).some(k=>/^m_.*D$/.test(k)&&saved.v[k])} // older saves: keep the extra column if it was used
 else{$("saveExp").checked=true;firstRun=true} // first visit starts blank
 if(saved?.v){firstRun=!!saved.first;showExample=!!saved.ex}
 // "Time left" was typed on another day: rebuild it from the saved end so it keeps counting down.
 const endAt=saved?.endAt&&new Date(saved.endAt);
 // only when the player actually typed a time left (blank fields must stay blank)
 const typed=saved?.v&&(String(saved.v.remDays??"").trim()!==""||String(saved.v.remHours??"").trim()!=="");
 if(mode==="remaining"&&typed&&endAt&&isFinite(endAt)){const h=Math.max(0,(endAt-Date.now())/36e5);$("remDays").value=Math.floor(h/24);$("remHours").value=Math.floor(h%24);remEnd=endAt}
 setLang(lang);setMode(mode);
 setInterval(calc,60000); // keep the countdown fresh
})();
</script>
